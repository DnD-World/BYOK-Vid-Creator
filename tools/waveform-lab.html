<!doctype html>
<meta charset="utf-8">
<title>Waveform lab — round 2</title>
<!--
  ROUND 2, from Ak's ranking: 6 (particles) > 5 (bloom) > 2 (deviation) > 4.
  The motion question is settled — every cell here runs on DEVIATION, each
  band's departure from its own rolling average, so the ring is still on a
  steady vowel and erupts on a consonant.

  Three things were wrong and are rebuilt rather than tweaked:

    - the fill was one flat colour, showed its inner disc, and had jagged
      corners. It is a real gradient on an ANNULUS now, drawn through a smooth
      curve instead of straight segments between bands.
    - the ribbon had the same jagged corners. Same curve fix.
    - the sparkles were invisible: a handful of dots hidden behind bars. The
      bars are gone, there are ~40x as many, and they burst in random
      directions rather than sliding straight out along a spoke.
-->
<style>
  body { margin:0; background:#0b0b0d; color:#eee; font:13px system-ui; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:4px; }
  .cell { position:relative; aspect-ratio:1; background:#111318; border-radius:6px; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .lab { position:absolute; left:6px; top:6px; background:#000b; padding:3px 6px;
         border-radius:4px; font-size:11px; line-height:1.35; pointer-events:none; }
  .lab b { color:#ff9a3c; }
  .hint { padding:6px 10px; color:#999; font-size:12px; }
</style>

<div class="grid" id="grid"></div>
<div class="hint">All six run on deviation. Faint circle = avatar size.</div>

<script>
const N = 24, ACCENT = "#ff9a3c", COOL = "#3cb4ff", WARM = "#ffd66b";

const avg = new Float32Array(N).fill(0.2);
let bands = new Float32Array(N), dev = new Float32Array(N);
let syllable = 0, nextSyl = 0, energy = 0;

function tick(t) {
  if (t > nextSyl) { syllable = 1; nextSyl = t + 120 + Math.random() * 260; }
  syllable *= 0.90;
  let sum = 0;
  for (let i = 0; i < N; i++) {
    const formant = Math.exp(-Math.pow((i-5)/5,2))*0.55 + Math.exp(-Math.pow((i-14)/6,2))*0.3;
    const noise = 0.06*Math.sin(t/190 + i*1.7) + 0.05*Math.random();
    bands[i] = Math.min(1, formant*(0.45 + syllable*0.9) + noise);
    avg[i] += (bands[i]-avg[i])*0.06;
    dev[i] = Math.max(0, bands[i]-avg[i])*3.2;
    sum += dev[i];
  }
  energy = sum / N;
  tickFlow();
}

/** A closed curve through the band points, with ROUNDED peaks.
 *
 *  Straight lines between 24 points give the corners Ak called jagged and
 *  unnatural — a waveform is a continuous thing and the eye knows it. Each
 *  segment is a quadratic through the midpoints of its neighbours, which is
 *  the cheapest curve that never overshoots and never cusps. */
function smoothRing(c, cx, cy, radiusAt, steps) {
  const pt = i => { const a = (i/steps)*Math.PI*2 - Math.PI/2, r = radiusAt(i);
                    return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  const mid = (p,q) => [(p[0]+q[0])/2, (p[1]+q[1])/2];
  let prev = pt(0), start = mid(pt(steps-1), prev);
  c.moveTo(start[0], start[1]);
  for (let i = 1; i <= steps; i++) {
    const cur = pt(i % steps), m = mid(prev, cur);
    c.quadraticCurveTo(prev[0], prev[1], m[0], m[1]);
    prev = cur;
  }
  c.closePath();
}

/** Band value at a FRACTIONAL position, interpolated.
 *
 *  Snapping each curve point to its nearest band gave 24 flat plateaus joined
 *  by steps — which is what made the filled ring look like a cog rather than a
 *  waveform. Smoothing the curve could not fix it because the data itself was
 *  a staircase. Reading between the bands is the actual fix. */
function bandAt(x, smooth, src) {
  const d = src || dev;
  const at = j => {
    const k = ((j % N) + N) % N;
    if (!smooth) return d[k];
    // NEIGHBOUR AVERAGE. Interpolating between 24 points still traces 24
    // lobes, which is the "coggish" Ak keeps seeing — the curve is smooth but
    // the SHAPE still has 24 corners' worth of information in it. Blending
    // each band with the two beside it turns lobes into a flowing line, at the
    // cost of a little per-band detail that a ribbon was never showing anyway.
    return (d[(k - 1 + N) % N] + d[k] * 2 + d[(k + 1) % N]) / 4;
  };
  const f = ((x % N) + N) % N, i = Math.floor(f), frac = f - i;
  const a = at(i), b = at(i + 1);
  // Cosine rather than linear: no corner where two segments meet.
  return a + (b - a) * (1 - Math.cos(frac * Math.PI)) / 2;
}

/** A SLOW copy of the deviation, for the styles that should flow.
 *
 *  dev has a sharp attack and a quick decay, which is right for particles and
 *  bloom — they are supposed to hit like a drum. It is wrong for a ribbon or a
 *  filled ring, where Ak wants water: something with inertia that rolls rather
 *  than snaps. This chases dev slowly, so a peak takes a moment to arrive and
 *  longer to leave. */
const flow = new Float32Array(N).fill(0.2);
function tickFlow() {
  for (let i = 0; i < N; i++) {
    const target = dev[i];
    // Rises faster than it falls, like a swell.
    flow[i] += (target - flow[i]) * (target > flow[i] ? 0.055 : 0.028);
  }
}

const P = [];    // particles
const S = [];    // sparks

const STYLES = [
  {
    name: "A · particles",
    note: "your pick, unchanged",
    draw(c,w,h,t){ particles(c,w,h,t,6,false); ringBars(c,w,h,"rgba(255,154,60,.5)"); },
  },
  {
    name: "B · particles, denser",
    note: "3x emission, wider spread, no bars",
    draw(c,w,h,t){ particles(c,w,h,t,18,true); },
  },
  {
    name: "C · sparkle storm",
    note: "no bars, <b>random blowouts</b>, ~40x more",
    draw: sparkles,
  },
  {
    name: "D · ribbon, rounded",
    note: "flowing + drifting — no band owns an angle",
    draw(c,w,h,t){
      const cx=w/2, cy=h/2, r0=Math.min(w,h)*0.26, k=Math.min(w,h)*0.13;
      const spin = t/2600;
      for (const [side,colour] of [[1,ACCENT],[-1,COOL]]) {
        c.beginPath();
        // DRIFT. Band 0 was always drawn at the top, and low bands carry most
        // of a voice's energy, so the same corner bulged permanently — the
        // stationary lump Ak spotted. Rotating the mapping means no angle is
        // owned by one frequency for long.
        smoothRing(c, cx, cy,
          i => r0 + side*(0.02*Math.min(w,h) + bandAt(i*N/96 + spin, true, flow)*k), 96);
        c.strokeStyle = colour; c.lineWidth = Math.max(2.5,w/140);
        c.lineJoin = "round"; c.stroke();
      }
    },
  },
  {
    name: "E · gradient ring",
    note: "<b>water</b>, not drums — inertia plus a travelling swell",
    draw(c,w,h,t){
      const cx=w/2, cy=h/2, r0=Math.min(w,h)*0.235, k=Math.min(w,h)*0.15;
      const g = c.createRadialGradient(cx,cy,r0,cx,cy,r0+k);
      g.addColorStop(0,"rgba(255,214,107,.95)");
      g.addColorStop(.45,"rgba(255,154,60,.7)");
      g.addColorStop(1,"rgba(255,80,40,0)");
      c.beginPath();
      // A floor of 18% so the ring never disappears in a quiet moment.
      smoothRing(c, cx, cy, i => r0 + (0.22 + bandAt(i*N/96 + t/3400, true, flow)*0.78)*k, 96);
      smoothRing(c, cx, cy, () => r0, 96);                              // inner hole
      c.fillStyle = g; c.fill("evenodd");                               // annulus
    },
  },
  {
    name: "F · particles + bloom",
    note: "your top two together",
    draw(c,w,h,t){
      c.shadowColor = ACCENT; c.shadowBlur = 6 + syllable*36;
      ringBars(c,w,h,ACCENT);
      c.shadowBlur = 0;
      particles(c,w,h,t,10,true);
    },
  },
];

function ringBars(c,w,h,colour){
  const cx=w/2, cy=h/2, r0=Math.min(w,h)*0.24, maxLen=Math.min(w,h)*0.16;
  c.lineCap="round"; c.strokeStyle=colour; c.lineWidth=Math.max(2,w/150);
  for (let i=0;i<N*2;i++){
    const a=(i/(N*2))*Math.PI*2-Math.PI/2, r1=r0+Math.min(1,dev[i%N])*maxLen;
    c.beginPath(); c.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
    c.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); c.stroke();
  }
}

function particles(c,w,h,t,rate,wide){
  const cx=w/2, cy=h/2, r0=Math.min(w,h)*0.24;
  if (syllable > 0.5) for (let k=0;k<rate;k++){
    const i = Math.floor(Math.random()*N);
    const a = (i/N)*Math.PI*2 - Math.PI/2 + (wide ? (Math.random()-.5)*0.5 : 0);
    P.push({ a, r:r0, z:0.6+Math.random()*0.8, v:(0.5+dev[i]*2.4)*(w/300), life:1 });
  }
  for (let n=P.length-1;n>=0;n--){
    const p=P[n]; p.r+=p.v; p.life-=0.012; p.z+=0.004;
    if (p.life<=0){ P.splice(n,1); continue; }
    const sc=1/p.z;
    c.globalAlpha=p.life*Math.min(1,sc); c.fillStyle=p.z<1?ACCENT:COOL;
    c.beginPath(); c.arc(cx+Math.cos(p.a)*p.r, cy+Math.sin(p.a)*p.r, Math.max(1,3*sc*(w/300)),0,7); c.fill();
  }
  c.globalAlpha=1;
}

/** Sparks that BURST rather than radiate.
 *
 *  The first version put a few dots on a spoke and they read as a fringe on the
 *  bars. These are born on the ring but given their own random heading and a
 *  little gravity, so they scatter — closer to embers off a fire than to a
 *  starburst diagram. Emission scales with the transient, so a loud consonant
 *  throws a shower and a quiet stretch throws none. */
function sparkles(c,w,h,t){
  const cx=w/2, cy=h/2, r0=Math.min(w,h)*0.25, s=w/300;
  const born = Math.round(energy*140 + syllable*90);
  for (let k=0;k<born;k++){
    const i = Math.floor(Math.random()*N);
    if (dev[i] < 0.15) continue;
    const a = (i/N)*Math.PI*2 - Math.PI/2 + (Math.random()-.5)*0.55;
    const heading = a + (Math.random()-.5)*1.6;          // its own direction
    const sp = (0.4 + Math.random()*dev[i]*2.6)*s;
    S.push({ x:cx+Math.cos(a)*r0, y:cy+Math.sin(a)*r0,
             vx:Math.cos(heading)*sp, vy:Math.sin(heading)*sp,
             life:1, warm:Math.random()<0.35 });
  }
  for (let n=S.length-1;n>=0;n--){
    const p=S[n];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.985; p.vy=p.vy*0.985+0.012*s;   // drag + drift
    p.life-=0.016;
    if (p.life<=0){ S.splice(n,1); continue; }
    c.globalAlpha=p.life*p.life;
    c.fillStyle=p.warm?WARM:"#fff";
    const sz=Math.max(0.8,1.7*p.life*s);
    c.fillRect(p.x,p.y,sz,sz);
  }
  c.globalAlpha=1;
}

const grid=document.getElementById("grid");
const cells=STYLES.map(s=>{
  const d=document.createElement("div"); d.className="cell";
  const cv=document.createElement("canvas");
  const lab=document.createElement("div"); lab.className="lab";
  lab.innerHTML=`<b>${s.name}</b><br>${s.note}`;
  d.append(cv,lab); grid.append(d);
  return {s,cv,ctx:cv.getContext("2d")};
});

function frame(t){
  tick(t);
  for (const {s,cv,ctx} of cells){
    const w=cv.width=cv.clientWidth, h=cv.height=cv.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle="#ffffff18"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(w/2,h/2,Math.min(w,h)*0.22,0,7); ctx.stroke();
    s.draw(ctx,w,h,t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
