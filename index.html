<!DOCTYPE html>
<!--
  data-dress is Deco Noir's ornament level. This is the flagship surface, so
  it runs "full" — the reduced levels exist for weaker surfaces (a WordPress
  settings page, a browser popup), not for this one.

  The colourway is deliberately NOT set: this app drives its own accent from
  the Appearance picker, so it writes the accent tokens directly rather than
  adopting one of the library's fixed colourways.
-->
<html lang="en" data-dress="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYOK-Vid-Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
